<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tri-ortho-title tri-ortho-desc">
      <title id="tri-ortho-title">Sequential tri-orthogonal decomposition of the function vector</title>
      <desc id="tri-ortho-desc">v_full is first projected onto Control-data AGOP to yield v_struct. The remainder v_full minus v_struct is then projected onto the top task-AGOP directions to yield v_parallel. The leftover is v_perp, the task-orthogonal remainder. v_parallel is not a direct projection of the original function vector.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Connectors first -->
      <line x1="280" y1="88" x2="280" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="156" x2="560" y2="156" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="188" x2="280" y2="228" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="280" y1="280" x2="280" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="352" x2="560" y2="352" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="280" y1="384" x2="280" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow label: residual fork (beside vertical segment, 12px gap from stroke) -->
      <rect x="296" y="198" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="332" y="208" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">residual</text>

      <!-- v_full (start oval) -->
      <rect x="180" y="40" width="200" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="180" y="40" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="280" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">v_full</text>
      <text x="280" y="76" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">function vector</text>

      <!-- Step 1: project original onto Control-data AGOP -->
      <rect x="140" y="124" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="140" y="124" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="150" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Project onto</text>
      <text x="280" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Control-data AGOP</text>

      <!-- v_struct -->
      <rect x="560" y="132" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="132" width="200" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="660" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">v_struct</text>
      <text x="660" y="168" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">structural</text>

      <!-- Residual state: not a second projection of v_full -->
      <rect x="140" y="228" width="280" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="140" y="228" width="280" height="52" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="280" y="250" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">residual</text>
      <text x="280" y="266" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">v_full − v_struct</text>

      <!-- Step 2: project remainder onto top task-AGOP directions -->
      <rect x="140" y="320" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="140" y="320" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Project the remainder onto</text>
      <text x="280" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the top task-AGOP directions</text>

      <!-- v_parallel (focal: this is the residual projection, not a direct FV projection) -->
      <rect x="560" y="328" width="200" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="328" width="200" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="660" y="350" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">v_parallel</text>
      <text x="660" y="364" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">task-parallel</text>

      <!-- v_perp (end oval) -->
      <rect x="180" y="424" width="200" height="48" rx="24" fill="#f5f5f5"/>
      <rect x="180" y="424" width="200" height="48" rx="24" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="280" y="446" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">v_perp</text>
      <text x="280" y="460" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif" text-anchor="middle">task-orthogonal remainder</text>

      <!-- Reconstruction identity (not a figure title) -->
      <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="480" y="568" fill="#4f5d75" font-size="12" font-family="'Geist Mono', monospace" text-anchor="middle">v_full = v_struct + v_parallel + v_perp</text>
    </svg>
